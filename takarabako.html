<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>たからばこ｜日向の裏庭</title>

  <style>

    body {
      margin: 0;
      background: #f8f3e8;
      color: #62564b;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      line-height: 1.8;
    }

    .garden {
      width: 90%;
      max-width: 760px;
      margin: 0 auto;
      padding: 60px 0;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: normal;
      letter-spacing: 0.15em;
      margin: 0 0 15px;
      color: #66594d;
    }

    .flower {
      font-size: 1.5rem;
      letter-spacing: 0.5em;
      margin-bottom: 15px;
    }

    .lead {
      font-size: 0.95rem;
      margin: 0;
    }

    section {
      margin-bottom: 45px;
    }

    h2 {
      font-size: 1.05rem;
      font-weight: normal;
      text-align: center;
      letter-spacing: 0.12em;
      margin-bottom: 20px;
      color: #766556;
    }

    /* たからばこの箱 */

    .treasure-boxes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .treasure-box {
      padding: 22px 24px;
      background: #fffdf8;
      border: 1px solid #ded4c5;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .treasure-box h3 {
      font-size: 1.05rem;
      font-weight: normal;
      margin: 0 0 12px;
      color: #6d5c4d;
    }

    .treasure-box p {
      font-size: 0.88rem;
      margin: 6px 0;
      color: #62564b;
    }

    .treasure-box p a {
      color: #766556;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .treasure-box p a:hover {
      color: #9a8068;
    }

    /* その他だけ少し幅広く */

    .box-other {
      grid-column: 1 / -1;
    }

    .back {
      text-align: center;
      margin-top: 50px;
      font-size: 0.85rem;
    }

    .back a {
      color: #766556;
      text-decoration: none;
      border-bottom: 1px dotted #9a8d7f;
    }

    .garden-info {
      text-align: center;
      font-size: 0.78rem;
      color: #9a8d7f;
      margin-top: 55px;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #aaa094;
      margin-top: 50px;
    }

    @media (max-width: 600px) {

      .garden {
        width: 88%;
        padding: 40px 0;
      }

      h1 {
        font-size: 2rem;
      }

      .treasure-boxes {
        grid-template-columns: 1fr;
      }

      .box-other {
        grid-column: auto;
      }

    }

  </style>
</head>

<body>

  <main class="garden">

    <header>
      <div class="flower">✿　✿　✿</div>
      <h1>たからばこ</h1>
      <p class="lead">
        すきなものを、ちょっとずつ。
      </p>
    </header>


    <section>

      <div class="treasure-boxes">

        <div class="treasure-box">
          <h3>🎬 映画</h3>
          <p>『好きな映画の名前』</p>
          <p>『好きな映画の名前』</p>
          <p>『好きな映画の名前』</p>
        </div>


        <div class="treasure-box">
          <h3>📺 テレビ</h3>
          <p>好きな番組</p>
          <p>好きな番組</p>
          <p>好きな番組</p>
        </div>


        <div class="treasure-box">
          <h3>🎵 音楽</h3>
          <p>好きな曲</p>
          <p>好きなアーティスト</p>
          <p>好きな音楽</p>
        </div>


        <div class="treasure-box">
          <h3>📺 YouTube</h3>
          <p>よく見るチャンネル</p>
          <p>お気に入りの動画</p>
          <p>よく見るもの</p>
        </div>


        <div class="treasure-box box-other">
          <h3>🧺 その他</h3>
          <p>ぽこあポケモン</p>
          <p>好きなおやつ</p>
          <p>好きな本</p>
          <p>好きなものいろいろ</p>
        </div>

      </div>

    </section>


    <div class="back">
      <a href="index.html">← 日向の裏庭へ戻る</a>
    </div>


    <div class="garden-info">
      🌱 開園　2026.08.30
    </div>


    <footer>
      お花は繰り返し咲くし、種もできる。
    </footer>


  </main>

</body>
</html>
