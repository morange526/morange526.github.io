<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>たからばこ｜日向の裏庭</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    background: #f8f3e8;
    color: #62564b;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    line-height: 1.8;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  .garden {
    width: 90%;
    max-width: 760px;
    margin: 0 auto;
    padding: 60px 0 80px;
  }

  header { text-align: center; margin-bottom: 50px; }

  .flower {
    font-size: 1.5rem;
    letter-spacing: 0.5em;
    margin-bottom: 15px;
  }

  h1 {
    font-size: 2.2rem;
    font-weight: normal;
    letter-spacing: 0.12em;
    margin: 0 0 15px;
    color: #66594d;
  }

  .intro {
    font-size: 0.9rem;
    margin: 0;
  }

  .category { margin-bottom: 48px; }

  .category h2 {
    font-size: 1.05rem;
    font-weight: normal;
    text-align: center;
    letter-spacing: 0.12em;
    margin: 0 0 20px;
    color: #766556;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .chip {
    flex: 1 1 180px;
    max-width: 260px;
  }

  .chip-btn {
    all: unset;
    box-sizing: border-box;
    display: block;
    width: 100%;
    text-align: center;
    padding: 10px 6px;
    background: rgba(255, 253, 248, 0.7);
    border-top: 1px solid #ded4c5;
    border-bottom: 1px solid #ded4c5;
    color: #6d5c4d;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: background 0.25s ease, border-color 0.25s ease;
  }
  .chip-btn:hover { background: rgba(255, 250, 240, 0.9); }
  .chip-btn:focus-visible { outline: 2px solid #c9a24b; outline-offset: 2px; }

  .chip.open .chip-btn {
    background: rgba(255, 250, 240, 0.9);
    border-color: #cbb894;
    border-bottom: none;
  }

  .chip-detail-outer {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.4s ease;
  }
  .chip.open .chip-detail-outer { grid-template-rows: 1fr; }

  .chip-detail-inner { overflow: hidden; }

  .chip-detail {
    padding: 10px 12px;
    background: rgba(255, 253, 248, 0.5);
    border-bottom: 1px solid #cbb894;
    font-size: 0.78rem;
    color: #897d70;
    text-align: left;
  }
  .chip-detail p { margin: 0; }
  .chip-detail a { color: #897d70; text-decoration: underline; text-decoration-color: #cbb894; }
  .chip-detail a:hover { color: #66594d; }

  .back {
    text-align: center;
    margin-top: 55px;
    font-size: 0.85rem;
  }
  .back a { color: #897d70; text-decoration: none; }
  .back a:hover { color: #66594d; text-decoration: underline; }

  footer {
    text-align: center;
    font-size: 0.75rem;
    color: #aaa094;
    margin-top: 50px;
  }

  @media (max-width: 600px) {
    .garden { width: 88%; padding: 40px 0 60px; }
    h1 { font-size: 1.8rem; }
    .chip { flex: 1 1 140px; max-width: 220px; }
  }
</style>
</head>
<body>
  <main class="garden">
    <header>
      <div class="flower">✿　✿　✿</div>
      <h1>たからばこ</h1>
      <p class="intro">
        その時ハマっているもの。本や映画、音楽など。<br>
        押すとちょっとだけ中身が見られます。<br>
        ただし心変わりは人の世の常。<br>
        記載後に飽きている可能性大いにあり。
      </p>
    </header>

    <div id="categories"></div>

    <div class="back"><a href="index.html">← 日向の裏庭へ戻る</a></div>

    <footer>あんなところにたんぽぽのわたげ。</footer>
  </main>

<script>
  // カテゴリを増やしたいときは、この配列に { name: "映画", items: [...] } の形で
  // オブジェクトを追加するだけでOKです。←むずかしいんだが
  const categories = [
    {
      name: "本",
      items: [
        {name: "だれも知らない<br>小さな国",detail: "背が伸びた後でも素敵な出来事は起こりうる、という希望を与えてくれる本。わたしの原点。若菜桂さんの挿し絵がよい。"},
        {name: "みどりのゆび",detail: "わたしの原点その2。こんなに美しい物語はない。これも挿し絵がよい。"},
        { name: "秘密の花園", detail: "成人後に読んだのに、昔からすきだったような感覚になった本。生きるのに必要なことが全て書かれている。しあわせの鍵は「和」。平和のわ、令和のわ、温和のわ。四角にwaと入れよう。" },
        { name: "ツバメ号とアマゾン号", detail: "おもしろすぎる！大人になってから読んだけどページをめくる手が止まらないとはまさにこのこと。男の子も女の子も活躍するよい話。ちなみに続きもおもしろい。おすすめ！" },
        { name: "マチルダは<br>小さな大天才", detail: "暴力には賢さと優しさで打ち勝て！というお話。小さくて賢い女の子が、すきな先生のために頭をひねって悪に立ち向かう。ロアルド・ダールのおかげで、小さなわたしはいろんな世界を旅することができた。" },
        { name: "魔女がいっぱい", detail: "これもダールさんの本。この本で読書感想文2回くらい書いたかもしれん。終わり方がものすごくすき。しあわせな余生。個人的にはあんまり体験したことのない形のハッピーエンド。" },
        { name: "ちいさなあおいさかな", detail: "全ての人間が読むべき絵本。やさしさの連鎖はたとえその人の命がなくなった後でも繋がっていく、みたいなおはなし。わたしの原点その3。ここに書いた本の中で一番知名度がなく、誰もこの本のことを知らない。" },
      ]
    },
    {
      name: "映画",
      items: [
        { name: "千と千尋の神隠し", detail: "ミーハーすぎるが結局とてもすき。人生で最初にTSUTAYAで借りたCDはこれとハウルのサントラ。あの後絶対に再会する。わたしにはわかる。" },
        { name: "紅の豚", detail: "なんかロマンチックじゃない、飛行艇なんて。ジブリ作品の中で一番グッズを買っているが、そもそもグッズの総数が少ない。" },
        { name: "トイストーリー123", detail: "ピクサーの最高傑作。人生を共に歩んだ相棒として大切にしていきたい作品。ウッディはアンディのおもちゃ。" },
        { name: "ナイトミュージアム", detail: "みんなで力を合わせて問題に立ち向かう！誰もいらない子がいない！最後は歌って踊ってごきげんに終わる！完璧な理想の映画。ジェドがすき。" },
        { name: "ノートルダムの鐘", detail: "初見映画の冒頭で涙が出たのは初めてかも。それくらい、オープニングの全てが完成されている。個人的には大ハピエンだと思っています。" },
        { name: "リメンバー・ミー", detail: "ラセター最後の大傑作。人の心を持っている人間が作った優しい物語。みんなで歌って踊って終わる映画にハズレなし。でもチチャロンのシーンいるかな？？いるけど……。" },
        { name: "落下の王国", detail: "夜ふかししたとある夜、偶然テレビで流れていたのを見て忘れられなくなってしまった作品。お話は悲しめなので何度もは見られないけど、景色がとにかく美しい。" },
        { name: "ズートピア", detail: "こういう関係の友だちがほしい。別に友だちでなくてもいい。こういう相手がほしい。俺のこと好きなんだろ〜？" },
        { name: "水の都の護神<br>ラティアスとラティオス", detail: "OPの曲がいい。この映画で「アコーディオンというものはいいな」と知った。大人になってから見ると登場人物が少なくてビビる。" },
        { name: "崖の上のポニョ", detail: "久石譲が描く「海」を余すことなく聴ける素晴らしい映画。曲がいい。曲がよすぎてこのサントラしか聴かなかった期間さえある。" },
        { name: "君たちはどう生きるか", detail: "正直一般人には理解が難しい。でも米津玄師の「地球儀」はほんとうによい。あの映画の内容をうまく補完している。こんな曲聴いたらそら宮崎さんも泣くよ。" },
        { name: "国宝", detail: "たまたま無料で見れたので見た映画。途中キツイからあんまり何度も見たくないけど、「君たちはどう生きるか」がすきな人間にはとてもハマる。この曲の主題歌は「地球儀」でいいと思う。" },
        { name: "ドラえもん<br>のび太のワンニャン時空伝", detail: "映画館で見た。自我を持ってから初めて「完璧なハピエン」ではない映画に触れ、かなり困惑した思い出。主題歌だいすき。ほんとうにだいすき。心から。" },
        { name: "クレヨンしんちゃん<br>嵐を呼ぶ アッパレ！<br>戦国大合戦", detail: "これの入場特典のおもちゃで200時間くらい遊んだと思う。幼少期のわたしはEDで人が死んだことを理解していなかった。あほすぎ。" },
        { name: "クレヨンしんちゃん<br>嵐を呼ぶジャングル", detail: "弟が死ぬほど見てた。「サルと仲良くなる愉快な映画」と思っていた。おもしろくてすき。小林幸子アクションミレニアムビ〜〜〜〜〜〜ム。" },
      ]
    },
    {
  name: "音楽",
  items: [
    { name: "TULIP", detail: "一人暮らししてた時にずっと聴いてた。2回だけコンサートに行った。ちょっと合唱っぽいよね。" },
    { name: "ジャパニーズ・<br>グラフィティⅫ", detail: "吹奏楽曲。東京佼成の2007年のアルバムの音源が一番すき。ポップス曲の中で一番すきかもしれない。演奏できてよかった。" },
    { name: "宇宙の音楽", detail: "吹奏楽曲。誰もが憧れる名曲。曲の構成がわかりやすいし聴いてておもしろい、そしてモチーフがわかりやすい。一度はカットなしフルを生で聴いてみたい。やっぱりスパークの曲はイイネ！！" },
    { name: "With Heart And Voice", detail: "これも吹奏楽曲。演奏したことあるクラシック系吹奏楽曲の中で一番すき。こんなにキラキラしたまぶしい曲があるだろうか。美しいフルートソロがあり、聴くとしあわせになれる。" },
    { name: "心の旅", detail: "TULIPも書いたけどこれも書く。TULIPの有名な曲。もしも許されるなら、眠りについた君をポケットにつめこんでそのままつれ去りたい、いつだってそう。おやすみからおはようまで一緒がいい。" },
    { name: "Go The Distance", detail: "ディズニー映画「ヘラクレス」内の一曲。巨匠アラン・メンケン作曲。アラン・メンケンはこの曲を世に出すために天界から降りてきた神である。叶うことなら一度でいいから演奏してみたい。" },
    { name: "世界の約束", detail: "「ハウルの動く城」の主題歌。ちょっと歌詞は高尚すぎてわたしにはよくわからないんですけれども（谷川俊太郎が書いています）、メロディーがとっても美しいのでとてもすき。演奏したい。倍賞千恵子の声もよい。" },
    
  ]
},
    {
      name: "食べもの",
      items: [
        { name: "唐船峡麺つゆ", detail: "いろはに千鳥をきっかけに知った麺つゆ。うまい。あまい。すぐなくなる。" },
        { name: "森永ラムネ", detail: "おいしい。おいしいからずっと食べてる。期間限定のグレープのやつもすき。顔のキャラ変わったの納得いかん。" },
      ]
    },
    {
      name: "その他ハマっているもの/いたもの",
      items: [
        { name: "大悟（芸人）", detail: "年々かわいい。顔がすき。ネタもすき。年末もうちょっとテレビに出てほしい。" },
        { name: "朝顔", detail: "何年か前から毎年育てている。今年（2026）はかなり上手に育った。毎日違う顔を見せてくれてかわいい。" },
        { name: "M!LK", detail: "いよいよ「流行ってるから見てる」と言い訳できなくなってきた。実はかなり好き。吉田さんかっこいいかわいい。曲も毎日聴いている。でもコンテンツが多すぎて全く追えていない。" },
        { name: "超特急", detail: "まだそんなに詳しくないけどかっこいい。ユーキくんかっこいい顔すきかわいい。あとMy Buddyすきよく聴く。歌のお兄さんたち歌うまい。リョウガさんはグーフィー的なかっこよさがある。" },
        { name: "シャインポスト<br>Be Your アイドル！", detail: "Switch2のゲーム。ゲーム実況でエンディングまで見た上で購入したソフトはこれが初めて。これのせいで「アイドルを応援するのって……もしや楽しいのか……？」になってしまった。蓮ちゃんと桃果はわたしが応援するからね〜。" },
      ]
    }
  ];

  const wrap = document.getElementById("categories");

  categories.forEach(cat => {
    const section = document.createElement("section");
    section.className = "category";

    const h2 = document.createElement("h2");
    h2.textContent = cat.name;
    section.appendChild(h2);

    const chips = document.createElement("div");
    chips.className = "chips";

    cat.items.forEach(item => {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.innerHTML = `
        <button class="chip-btn" aria-expanded="false">${item.name}</button>
        <div class="chip-detail-outer">
          <div class="chip-detail-inner">
            <div class="chip-detail"><p>${item.detail}</p></div>
          </div>
        </div>
      `;
      const btn = chip.querySelector(".chip-btn");
      btn.addEventListener("click", () => {
        const isOpen = chip.classList.toggle("open");
        btn.setAttribute("aria-expanded", String(isOpen));
      });
      chips.appendChild(chip);
    });

    section.appendChild(chips);
    wrap.appendChild(section);
  });
</script>
</body>
</html>
