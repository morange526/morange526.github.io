<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>たからばこ｜日向の裏庭</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    background: #f8f3e8;
    color: #62564b;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    line-height: 1.8;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  .garden {
    width: 90%;
    max-width: 760px;
    margin: 0 auto;
    padding: 60px 0 80px;
  }

  header { text-align: center; margin-bottom: 50px; }

  .flower {
    font-size: 1.5rem;
    letter-spacing: 0.5em;
    margin-bottom: 15px;
  }

  h1 {
    font-size: 2.2rem;
    font-weight: normal;
    letter-spacing: 0.12em;
    margin: 0 0 15px;
    color: #66594d;
  }

  .intro {
    font-size: 0.9rem;
    margin: 0;
  }

  .category { margin-bottom: 48px; }

  .category h2 {
    font-size: 1.05rem;
    font-weight: normal;
    text-align: center;
    letter-spacing: 0.12em;
    margin: 0 0 20px;
    color: #766556;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .chip {
    flex: 1 1 180px;
    max-width: 260px;
  }

  .chip-btn {
    all: unset;
    box-sizing: border-box;
    display: block;
    width: 100%;
    text-align: center;
    padding: 10px 6px;
    background: rgba(255, 253, 248, 0.7);
    border-top: 1px solid #ded4c5;
    border-bottom: 1px solid #ded4c5;
    color: #6d5c4d;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: background 0.25s ease, border-color 0.25s ease;
  }
  .chip-btn:hover { background: rgba(255, 250, 240, 0.9); }
  .chip-btn:focus-visible { outline: 2px solid #c9a24b; outline-offset: 2px; }

  .chip.open .chip-btn {
    background: rgba(255, 250, 240, 0.9);
    border-color: #cbb894;
    border-bottom: none;
  }

  .chip-detail-outer {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.4s ease;
  }
  .chip.open .chip-detail-outer { grid-template-rows: 1fr; }

  .chip-detail-inner { overflow: hidden; }

  .chip-detail {
    padding: 10px 12px;
    background: rgba(255, 253, 248, 0.5);
    border-bottom: 1px solid #cbb894;
    font-size: 0.78rem;
    color: #897d70;
    text-align: left;
  }
  .chip-detail p { margin: 0; }
  .chip-detail a { color: #897d70; text-decoration: underline; text-decoration-color: #cbb894; }
  .chip-detail a:hover { color: #66594d; }

  .back {
    text-align: center;
    margin-top: 55px;
    font-size: 0.85rem;
  }
  .back a { color: #897d70; text-decoration: none; }
  .back a:hover { color: #66594d; text-decoration: underline; }

  footer {
    text-align: center;
    font-size: 0.75rem;
    color: #aaa094;
    margin-top: 50px;
  }

  @media (max-width: 600px) {
    .garden { width: 88%; padding: 40px 0 60px; }
    h1 { font-size: 1.8rem; }
    .chip { flex: 1 1 140px; max-width: 220px; }
  }
</style>
</head>
<body>
  <main class="garden">
    <header>
      <div class="flower">✿　✿　✿</div>
      <h1>たからばこ</h1>
      <p class="intro">
        その時ハマっているもの。本や映画、食べものや人。<br>
        押すとちょっとだけ中身が見られます。
      </p>
    </header>

    <div id="categories"></div>

    <div class="back"><a href="index.html">← 日向の裏庭へ戻る</a></div>

    <footer>素敵なものがたくさん！</footer>
  </main>

<script>
  // カテゴリを増やしたいときは、この配列に { name: "映画", items: [...] } の形で
  // オブジェクトを追加するだけでOKです。←むずかしいんだが
  const categories = [
    {
      name: "本",
      items: [
        {name: "だれも知らない小さな国",detail: "背が伸びた後でも素敵な出来事は起こりうる、という希望を与えてくれる本。わたしの原点。若菜桂さんの挿し絵がよい。"},
        {name: "みどりのゆび",detail: "わたしの原点その2。こんなに美しい物語はない。これも挿し絵がよい。"},
      ]
    },
    {
      name: "映画",
      items: [
        { name: "千と千尋の神隠し", detail: "ミーハーすぎるが結局とてもすき。人生で最初にTSUTAYAで借りたCDはこれとハウルのサントラ。あの後絶対に再会する。わたしにはわかる。" },
        { name: "紅の豚", detail: "なんかロマンチックじゃない、飛行艇なんて。ジブリ作品の中で一番グッズを買っているが、そもそもグッズの総数が少ない。" },
        { name: "トイストーリー123", detail: "ピクサーの最高傑作。人生を共に歩んだ相棒として大切にしていきたい作品。ウッディはアンディのおもちゃ。" }
      ]
    },
    {
      name: "食べもの",
      items: [
        { name: "（なまえ）", detail: "（ここに好きな理由をメモしてね。日記にリンクしたい場合は archive.html#日付 の形で <a> タグを使えます）" }
      ]
    },
    {
      name: "その他ハマっているもの/いたもの",
      items: [
        { name: "（なまえ）", detail: "（ここに好きな理由をメモしてね）" }
      ]
    }
  ];

  const wrap = document.getElementById("categories");

  categories.forEach(cat => {
    const section = document.createElement("section");
    section.className = "category";

    const h2 = document.createElement("h2");
    h2.textContent = cat.name;
    section.appendChild(h2);

    const chips = document.createElement("div");
    chips.className = "chips";

    cat.items.forEach(item => {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.innerHTML = `
        <button class="chip-btn" aria-expanded="false">${item.name}</button>
        <div class="chip-detail-outer">
          <div class="chip-detail-inner">
            <div class="chip-detail"><p>${item.detail}</p></div>
          </div>
        </div>
      `;
      const btn = chip.querySelector(".chip-btn");
      btn.addEventListener("click", () => {
        const isOpen = chip.classList.toggle("open");
        btn.setAttribute("aria-expanded", String(isOpen));
      });
      chips.appendChild(chip);
    });

    section.appendChild(chips);
    wrap.appendChild(section);
  });
</script>
</body>
</html>
