<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>たそがれコレクション｜日向の裏庭</title>

  <style>
    body {
      margin: 0;
      background: #f8f3e8;
      color: #62564b;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      line-height: 1.8;
    }

    .garden {
      width: 90%;
      max-width: 760px;
      margin: 0 auto;
      padding: 60px 0;
    }

    h1 {
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 0.15em;
      text-align: center;
      margin: 0 0 45px;
      color: #66594d;
    }

    .intro {
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 50px;
    }

    .back {
      display: block;
      margin-top: 50px;
      text-align: center;
      font-size: 0.85rem;
      color: #897d70;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }

        .collection-item {
      margin-top: 60px;
    }

    .collection-title {
      font-size: 1.4rem;
      font-weight: normal;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }

    .collection-info {
      font-size: 0.85rem;
      color: #897d70;
      margin-bottom: 30px;
    }

    .main-photo {
      width: 100%;
      max-width: 520px;
      display: block;
      margin: 0 auto 15px;
    }

    .sub-photos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .sub-photos img {
      width: 100%;
      display: block;
    }

    .memo {
      margin-top: 35px;
      font-size: 0.9rem;
    }

    .colbase {
      display: inline-block;
      margin-top: 20px;
      color: #897d70;
      font-size: 0.85rem;
      text-decoration: none;
    }

    .colbase:hover {
      text-decoration: underline;
    }
    
  </style>
</head>

<body>

 <main class="garden">

  <h1>たそがれコレクション</h1>

  <p class="intro">
    美術館、博物館などで出会ったものたちを記録しています。
  </p>


  <section class="collection-item">

    <h2 class="collection-title">猿猴図</h2>

    <p class="collection-info">
      狩野山雪 │ 江戸時代・17世紀（A-11845）
    </p>


    <img
      class="main-photo"
      src="images/collection/A-11845/A-11845_01.jpg"
      alt="猿猴図">

    <div class="sub-photos">

      <img
        src="images/collection/A-11845/A-11845_02.jpg"
        alt="猿猴図">

      <img
        src="images/collection/A-11845/A-11845_03.jpg"
        alt="猿猴図">

    </div>


    <div class="memo">
      ずっと見たかったおさる！もふもふかわいい。<br>
      思ったより作品が縦長で面白い。
    </div>


  </section>


  <a class="back" href="index.html">← 日向の裏庭へ戻る</a>

</main>

</body>
</html>
